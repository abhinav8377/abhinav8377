```yaml
name: Update Activity Chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: abhinav8377
          token: ${{ secrets.GITHUB_TOKEN }}
          default-days: "365"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish charts to activity-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd activity-dist
          git init
          git checkout --orphan activity-assets
          git add -A
          git commit -m "Update activity charts"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:activity-assets
```
