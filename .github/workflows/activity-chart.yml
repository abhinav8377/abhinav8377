
name: Generate Contribution Activity Chart

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate activity chart
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: abhinav8377
          token: ${{ secrets.GITHUB_TOKEN }}
          default-days: "365"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish chart SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: activity-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
